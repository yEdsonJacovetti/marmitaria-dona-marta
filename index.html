<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b4531f">
  <title>Marmitaria da Dona Marta</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <h1>🍱 Dona Marta</h1>
    <nav class="abas" aria-label="Telas">
      <button class="aba ativa" data-tela="pedido">Pedido</button>
      <button class="aba" data-tela="cozinha">Cozinha <span class="contador" id="cont-cozinha"></span></button>
      <button class="aba" data-tela="entregas">Entregas <span class="contador" id="cont-entregas"></span></button>
      <button class="aba" data-tela="caixa">Caixa</button>
    </nav>
  </header>

  <main>
    <!-- TELA 1: NOVO PEDIDO -->
    <section id="tela-pedido" class="tela ativa">
      <div class="bloco">
        <h2>Cliente</h2>
        <input id="busca-cliente" type="search" placeholder="Buscar por nome ou telefone" autocomplete="off">
        <div id="sugestoes-cliente" class="chips"></div>
        <div class="campos">
          <input id="cli-nome" placeholder="Nome">
          <input id="cli-telefone" placeholder="Telefone" inputmode="tel">
          <input id="cli-endereco" placeholder="Endereço (o 'de sempre')">
        </div>
      </div>

      <div class="bloco">
        <h2>Marmita</h2>
        <div id="tamanhos" class="grade-3"></div>
        <h3>Tirar</h3>
        <div id="chips-sem" class="chips"></div>
        <h3>Trocar</h3>
        <div id="chips-troca" class="chips"></div>
        <h3>Adicional</h3>
        <div id="chips-adicional" class="chips"></div>
        <div class="linha-qtd">
          <button class="btn-qtd" id="qtd-menos" aria-label="Diminuir">−</button>
          <span id="qtd">1</span>
          <button class="btn-qtd" id="qtd-mais" aria-label="Aumentar">+</button>
          <button class="btn primario" id="btn-adicionar">Adicionar marmita</button>
        </div>
      </div>

      <div class="bloco">
        <h2>Itens do pedido</h2>
        <ul id="lista-itens" class="lista-itens"><li class="vazio">Nenhuma marmita ainda</li></ul>
      </div>

      <div class="bloco">
        <div class="grade-2" id="opcoes-entrega">
          <button class="opcao selecionada" data-entrega="entrega">🛵 Entrega</button>
          <button class="opcao" data-entrega="retirada">🏠 Retirada</button>
        </div>
        <div class="grade-3" id="opcoes-pagamento">
          <button class="opcao selecionada" data-pagamento="pix">Pix</button>
          <button class="opcao" data-pagamento="dinheiro">Dinheiro</button>
          <button class="opcao" id="btn-pago">Já pago?</button>
        </div>
      </div>

      <div class="rodape-pedido">
        <div class="total">Total: <strong id="total">R$ 0,00</strong></div>
        <button class="btn sucesso grande" id="btn-salvar">Salvar pedido</button>
      </div>
    </section>

    <!-- TELA 2: COZINHA -->
    <section id="tela-cozinha" class="tela">
      <div class="quadro">
        <div class="coluna">
          <h2>Novos</h2>
          <div id="col-novo"></div>
        </div>
        <div class="coluna" id="coluna-preparando">
          <h2>Preparando <span id="wip"></span></h2>
          <div id="col-preparando"></div>
        </div>
        <div class="coluna">
          <h2>Prontos</h2>
          <div id="col-pronto"></div>
        </div>
      </div>
    </section>

    <!-- TELA 3: ENTREGAS -->
    <section id="tela-entregas" class="tela">
      <div class="quadro">
        <div class="coluna">
          <h2>Prontos para sair</h2>
          <div id="col-ent-pronto"></div>
        </div>
        <div class="coluna">
          <h2>Saiu para entrega</h2>
          <div id="col-ent-saiu"></div>
        </div>
      </div>
    </section>

    <!-- TELA 4: CAIXA -->
    <section id="tela-caixa" class="tela">
      <h2>Caixa de hoje <small id="data-caixa"></small></h2>
      <div class="resumo" id="resumo-caixa"></div>
      <div class="bloco">
        <h2>Quem está devendo</h2>
        <div id="lista-devedores"></div>
      </div>
      <div class="bloco">
        <h2>Pedidos do dia</h2>
        <ul id="lista-dia" class="lista-itens"></ul>
      </div>
    </section>
  </main>

  <div id="aviso" class="aviso" role="status"></div>

  <script src="js/regras.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
